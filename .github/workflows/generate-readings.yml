name: Generate Compound Readings

on:
  # Trigger quando vengono modificati i file chiave
  push:
    branches:
      - main
    paths:
      - 'data/byakuzhi.json'
      - 'data/compounds.csv'
  
  # Permetti esecuzione manuale
  workflow_dispatch:

jobs:
  generate-readings:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Run reading generation script
      run: |
        python generate_compound_readings.py
    
    - name: Check for changes
      id: check_changes
      run: |
        if [ -f "data/compounds_updated.csv" ]; then
          if ! diff -q data/compounds.csv data/compounds_updated.csv > /dev/null 2>&1; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "changes=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Create Pull Request
      if: steps.check_changes.outputs.changes == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'Auto-generate compound readings'
        title: '🤖 Auto-generated compound readings'
        body: |
          ## 🔍 Automatic Compound Reading Generation
          
          This PR was automatically generated by the `generate_compound_readings.py` script.
          
          ### 📊 Changes
          
          The script has generated new Izaki readings for compounds based on the byakuzhi database.
          
          ### 📝 Report
          
          ```
          $(cat report.txt)
          ```
          
          ### ✅ Review Checklist
          
          - [ ] Verify generated readings are phonetically correct
          - [ ] Check for any unexpected transformations
          - [ ] Confirm no existing readings were overwritten
          
          ---
          
          🤖 *This PR was created automatically by GitHub Actions*
        branch: auto-generate-readings
        delete-branch: true
        labels: |
          automated
          compound-readings
        assignees: izaland
    
    - name: Upload report as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: generation-report
        path: report.txt
        retention-days: 30
