name: Generate Compound Readings

on:
  # Trigger quando vengono modificati i file chiave
  push:
    branches:
      - main
    paths:
      - 'data/byakuzhi.json'
      - 'data/compounds.csv'
  
  # Permetti esecuzione manuale con opzioni
  workflow_dispatch:
    inputs:
      create_pr:
        description: 'Create Pull Request with changes?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      pr_title:
        description: 'Custom PR title (optional)'
        required: false
        default: '🤖 Auto-generated compound readings'

jobs:
  generate-readings:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Run reading generation script
      run: |
        python generate_compound_readings.py
    
    - name: Replace compounds.csv with updated version
      run: |
        if [ -f "data/compounds_updated.csv" ]; then
          cp data/compounds_updated.csv data/compounds.csv
          echo "File replaced successfully"
        else
          echo "Error: compounds_updated.csv not found"
          exit 1
        fi
    
    - name: Read report content
      id: report
      run: |
        if [ -f "report.txt" ]; then
          echo "content<<EOF" >> $GITHUB_OUTPUT
          cat report.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "content=Report file not found" >> $GITHUB_OUTPUT
        fi
    
    - name: Check for changes
      id: check_changes
      run: |
        if git diff --quiet data/compounds.csv; then
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "No changes detected"
        else
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "Changes detected"
          echo "### 📊 Changes Summary" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          git diff --stat data/compounds.csv >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Create Pull Request
      if: |
        steps.check_changes.outputs.changes == 'true' && 
        (github.event_name == 'push' || inputs.create_pr == 'true')
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: '🤖 Auto-generate compound readings'
        title: ${{ inputs.pr_title || '🤖 Auto-generated compound readings' }}
        body: |
          ## 🔍 Automatic Compound Reading Generation
          
          This PR was automatically generated by the `generate_compound_readings.py` script.
          
          ### 📊 Changes
          
          The script has generated new Izaki readings for compounds based on the byakuzhi database.
          
          ### 📝 Report
          
          ```
          ${{ steps.report.outputs.content }}
          ```
          
          ### ✅ Review Checklist
          
          - [ ] Verify generated readings are phonetically correct
          - [ ] Check for any unexpected transformations
          - [ ] Confirm no existing readings were overwritten
          
          ---
          
          🤖 *This PR was created automatically by GitHub Actions*
          
          **Triggered by**: ${{ github.event_name == 'workflow_dispatch' && format('Manual run by @{0}', github.actor) || 'Push event' }}
        branch: auto-generate-readings-${{ github.run_number }}
        delete-branch: true
        labels: |
          automated
          compound-readings
        assignees: izaland
    
    - name: Commit directly to main
      if: |
        steps.check_changes.outputs.changes == 'true' && 
        github.event_name == 'workflow_dispatch' && 
        inputs.create_pr == 'false'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/compounds.csv
        git commit -m "🤖 Auto-generate compound readings [skip ci]"
        git push
    
    - name: Upload report as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: generation-report-${{ github.run_number }}
        path: report.txt
        retention-days: 30
    
    - name: No changes summary
      if: steps.check_changes.outputs.changes == 'false'
      run: |
        echo "✅ No new readings to generate. All compounds already have readings or are missing required byakuzhi." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Report Summary" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat report.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
