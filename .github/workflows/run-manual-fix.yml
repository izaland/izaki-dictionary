name: Run Manual Dictionary Fix

on:
  push:
    branches:
      - manual-dictionary-fix

jobs:
  fix:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install epitran
    
    - name: Run fix script
      run: python3 scripts/fix_dictionary_manual.py
    
    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/dictionary.json
        git diff --staged --quiet || git commit -m "Apply dictionary fixes"
        git push
