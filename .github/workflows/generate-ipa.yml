name: Generate Missing IPA

on:
  workflow_dispatch:
    inputs:
      create_pr:
        description: 'Create Pull Request instead of direct commit'
        required: false
        type: boolean
        default: false

jobs:
  generate_ipa:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 🔧 Generate missing IPA
        id: generate
        run: |
          echo "## IPA Generation Report" >> $GITHUB_STEP_SUMMARY
          python scripts/generate_missing_ipa.py | tee ipa_report.txt
          cat ipa_report.txt >> $GITHUB_STEP_SUMMARY
          
          # Check if any IPA was generated
          if grep -q "IPA generated: 0" ipa_report.txt; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: 📝 Check for changes
        id: git_diff
        run: |
          if git diff --quiet data/dictionary.json; then
            echo "No changes made"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git diff --stat data/dictionary.json
          fi
      
      - name: 💾 Commit changes (Direct)
        if: |
          steps.git_diff.outputs.has_changes == 'true' &&
          !inputs.create_pr
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/dictionary.json
          
          # Get count from report
          COUNT=$(grep "IPA generated:" ipa_report.txt | awk '{print $3}')
          
          git commit -m "✨ Generate IPA for ${COUNT} entries
          
          Automatically generated missing IPA transcriptions.
          
          Generated by GitHub Actions."
          
          git push
      
      - name: 📤 Create Pull Request
        if: |
          steps.git_diff.outputs.has_changes == 'true' &&
          inputs.create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "✨ Generate missing IPA transcriptions"
          title: "✨ Add IPA for entries with missing transcriptions"
          body: |
            ## Automatic IPA Generation
            
            This PR adds IPA transcriptions for entries that were missing them.
            
            ### Generation Report
            ```
            $(cat ipa_report.txt)
            ```
            
            ### What Changed
            - Converted lemma field to IPA using phonetic rules
            - Added IPA in format `/transcription/`
            - Detected and replaced placeholder values (【—】, Gujarati chars, etc.)
            
            ---
            🤖 This PR was created automatically by the IPA generation workflow.
          branch: auto-generate-ipa-${{ github.run_number }}
          delete-branch: true
      
      - name: ✅ Summary
        if: always()
        run: |
          echo "## Workflow Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.git_diff.outputs.has_changes }}" = "false" ]; then
            echo "✅ All entries already have IPA!" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ inputs.create_pr }}" = "true" ]; then
            echo "📤 Pull request created with generated IPA" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ IPA generated and committed to main branch" >> $GITHUB_STEP_SUMMARY
          fi