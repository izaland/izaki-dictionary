name: Update Izaki Dictionary

on:
  push:
    paths:
      - 'data/compounds.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dictionary:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 🔨 Build complete dictionary.json
        run: |
          python scripts/build_dictionary.py
      
      - name: 🔄 Generate IPA from compounds
        run: |
          python scripts/generate_ipa.py
      
      - name: 📤 Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 🤖 Auto-update dictionary files from CSV
          file_pattern: 'data/dictionary.json'
          commit_user_name: GitHub Actions Bot
          commit_user_email: actions@github.com
