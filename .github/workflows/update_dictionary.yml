name: Update Izaki Dictionary

on:
  push:
    paths:
      - 'data/compounds.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dictionary:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 🔨 Build complete dictionary.json
        run: |
          python scripts/build_dictionary.py
      
      - name: 🔄 Generate IPA from compounds
        run: |
          python scripts/generate_ipa.py
      
      - name: 📤 Commit and push updated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/dictionary.json data/dictionary_with_ipa.json
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-update dictionary files from CSV"
            git push
          else
            echo "No changes to commit"
          fi
