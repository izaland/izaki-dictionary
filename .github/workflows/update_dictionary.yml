name: Update Izaki Dictionary

on:
  push:
    paths:
      - 'data/compounds.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dictionary:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v2
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 🔨 Build complete dictionary.json
        run: |
          python scripts/build_dictionary.py
      
      - name: 🔄 Generate IPA from compounds
        run: |
          python scripts/generate_ipa.py
      
      - name: 📤 Commit and push updated files
        run: |
          git config user.name "Automated"
          git config user.email "actions@users.noreply.github.com"
          git add data/dictionary.json data/dictionary_with_ipa.json
          timestamp=$(date -u)
          git commit -m "🤖 Auto-update: ${timestamp}" || exit 0
          git push
