<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Izaki Dictionary - Byakuzhi Lookup</title>
    </head>
    <body>
        <div id = "navbar"></div>
        <section class="hero is-medium is-link">
            <div class="hero-body">
                <p class="title">Lookup Byakuzhi 百字檢索</p>
            </div>
        </section>
        <div class = "box m-5">
            <div class = "columns">
                <div class = "column">
                    <h1 class = "title is-4">Input 入力</h1>
                    <div class="field">
                        <div class="control">
                            <input class="input" id = "input" type="text" placeholder="Type a word! પટાડાઃ 入力ઠૅટૅડૅ！">
                        </div>
                    </div>
                </div>
                <div class = "column">
                    <h1 class = "title is-4">Output 結果</h1>
                    <div class="container">
                        <div class="notification" id = "output"></div>
                    </div>

                    <!-- REVERSE SEARCH -->
<hr style="margin: 3rem 0;">
<h2>Onnufu → Byakuzhi (Live)</h2>
<input type="text" id="reverseInput" placeholder="Digita: ai, ās, su..." style="width:100%; padding:1rem; font-size:1.1rem; margin-bottom:1rem;">
<div id="reverseOutput" style="min-height:100px; padding:1rem; background:#f9f9f9; border:1px solid #ddd; font-family:monospace; white-space:pre-wrap;"></div>


                </div>
            </div>
        </div>
    </body>
    <script src="/izaki-dictionary/scripts/askaoza.js"></script>
    <script src="/izaki-dictionary/scripts/lookup.js"></script>
    <script src="/izaki-dictionary/scripts/script.js"></script>
</html>
