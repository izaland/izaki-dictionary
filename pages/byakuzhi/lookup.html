<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Izaki Dictionary - Byakuzhi Lookup</title>
    </head>
    <body>
        <div id = "navbar"></div>
        <section class="hero is-medium is-link">
            <div class="hero-body">
                <p class="title">Lookup Byakuzhi</p>
            </div>
        </section>
        <div class = "box m-5">
            <div class = "columns">
                <div class = "column">
                    <h1 class = "title is-4">Input</h1>
                    <div class="field">
                        <div class="control">
                            <input class="input" id = "input" type="text" placeholder="Type a word!">
                        </div>
                    </div>
                </div>
                <div class = "column">
                    <h1 class = "title is-4">Output</h1>
                    <div class="container">
                        <div class="notification" id = "output"></div> <script src = "/izaki-dictionary/scripts/lookup.js"></script>
                    </div>

                </div>
            </div>
        </div>
    </body>

    <script src = "/izaki-dictionary/scripts/script.js"></script>

</html>
