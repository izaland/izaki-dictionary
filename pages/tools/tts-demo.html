<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Izaki TTS Demo - Izaki Dictionary</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="/izaki-dictionary/styles/main.css">
  <style>
    html[data-theme="light"] {
      --tts-bg: #ffffff; --tts-border: #dee2e6; --tts-text: #1a1a1a;
      --tts-sec: #6c757d; --tts-ipa-bg: #f8f9fa; --tts-ipa-border: #e0e0e0;
    }
    html[data-theme="dark"] {
      --tts-bg: #2a2a32; --tts-border: #3e3e4a; --tts-text: #e5e7eb;
      --tts-sec: #9ca3af; --tts-ipa-bg: #232328; --tts-ipa-border: #4a4a5a;
    }
    .tts-box {
      max-width: 680px; margin: 0 auto;
      background: var(--tts-bg); border: 1px solid var(--tts-border);
      border-radius: 14px; padding: 2rem;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }
    .ipa-display {
      font-family: 'Noto Serif', serif; font-size: 1.5rem;
      letter-spacing: .08em; background: var(--tts-ipa-bg);
      border: 1px solid var(--tts-ipa-border); border-radius: 8px;
      padding: .75rem 1.25rem; margin-top: .5rem;
      color: var(--tts-text); min-height: 3rem;
    }
    .ipa-label {
      font-size: .75rem; text-transform: uppercase; letter-spacing: .08em;
      color: var(--tts-sec); font-weight: 700; margin-bottom: .25rem;
    }
    .slider-row {
      display: flex; align-items: center; gap: 1rem; margin-bottom: .5rem;
    }
    .slider-row label { min-width: 80px; font-size: .9rem; color: var(--tts-text); }
    .slider-row input[type=range] { flex: 1; }
    .slider-row span { min-width: 36px; font-size: .85rem; font-family: monospace; color: var(--tts-sec); }
    #status { font-size: .85rem; color: var(--tts-sec); margin-top: .5rem; min-height: 1.4em; }
    #debugLog {
      font-family: monospace; font-size: .75rem;
      background: #111; color: #0f0; border-radius: 6px;
      padding: .75rem; max-height: 150px; overflow-y: auto;
      margin-top: 1rem; display: none;
    }
    .play-btn { min-width: 140px; }
  </style>
</head>
<body>
  <div id="navbar"></div>

  <section class="hero is-small is-link">
    <div class="hero-body has-text-centered">
      <p class="title">Izaki TTS Demo 🔊</p>
      <p class="subtitle">Text-to-speech test — eSpeak-ng</p>
    </div>
  </section>

  <section class="section">
    <div class="tts-box">

      <div class="field">
        <label class="label">Izaki text (Latin script)</label>
        <div class="control">
          <input class="input is-medium" type="text" id="inputText"
            placeholder="e.g. Kaizenshōji, Mitsutyen, Zenshidān"
            value="Kaizenshōji">
        </div>
      </div>

      <div class="field" style="margin-top:1rem">
        <div class="ipa-label">IPA preview</div>
        <div class="ipa-display" id="ipaDisplay">/…/</div>
      </div>

      <div class="field" style="margin-top:1.5rem">
        <div class="slider-row">
          <label>Speed</label>
          <input type="range" id="speedRange" min="80" max="300" value="140">
          <span id="speedVal">140</span>
        </div>
        <div class="slider-row">
          <label>Pitch</label>
          <input type="range" id="pitchRange" min="0" max="99" value="50">
          <span id="pitchVal">50</span>
        </div>
        <div class="slider-row">
          <label>Voice</label>
          <div class="select is-small">
            <select id="voiceSelect">
              <option value="it">it (Italian)</option>
              <option value="en">en (English)</option>
              <option value="la">la (Latin)</option>
              <option value="ja">ja (Japanese)</option>
              <option value="eo">eo (Esperanto)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="field" style="margin-top:1.25rem">
        <div class="buttons">
          <button class="button is-link is-medium play-btn" id="playBtn" disabled>
            ⏳ Loading…
          </button>
          <button class="button is-small" id="debugToggle">Debug</button>
        </div>
        <p id="status"></p>
        <div id="debugLog"></div>
      </div>

      <hr>
      <p class="ipa-label" style="margin-bottom:.5rem">Phoneme map (sample)</p>
      <div style="overflow-x:auto">
        <table class="table is-narrow is-bordered" style="font-size:.82rem">
          <thead><tr><th>Izaki</th><th>IPA</th><th>eSpeak</th></tr></thead>
          <tbody id="phonemeTable"></tbody>
        </table>
      </div>
    </div>
  </section>

  <script src="/izaki-dictionary/scripts/script.js"></script>
  <script>
  (function(){

    const debugEl = document.getElementById('debugLog');
    function dbg(msg) {
      const t = new Date().toISOString().substr(11,8);
      debugEl.innerHTML += `<div>[${t}] ${msg}</div>`;
      debugEl.scrollTop = debugEl.scrollHeight;
    }
    document.getElementById('debugToggle').onclick = () => {
      debugEl.style.display = debugEl.style.display === 'none' ? 'block' : 'none';
    };

    const IPA_MAP = [
      ['tsy','t͡ɕj'],['tsi','t͡ɕi'],['kw','kw'],['gw','gw'],
      ['hyen','hjɛn'],['tyen','tjɛn'],['hwa','xwa'],
      ['hy','hj'],['dz','d͡z'],['ts','t͡s'],
      ['zh','ʒ'],['sh','ʃ'],['ch','t͡ʃ'],['ny','ɲ'],
      ['ā','aː'],['ē','eː'],['ī','iː'],['ō','oː'],['ū','uː'],
      ['ð','ð'],['þ','θ'],['ŋ','ŋ'],
      ['a','a'],['e','e'],['i','i'],['o','o'],['u','u'],['y','y'],
      ['b','b'],['d','d'],['f','f'],['g','g'],['h','h'],
      ['j','d͡ʒ'],['k','k'],['l','l'],['m','m'],['n','n'],
      ['p','p'],['r','r'],['s','s'],['t','t'],['v','v'],
      ['w','w'],['x','x'],['z','z'],
    ];
    const ESP_MAP = [
      ['tsy','ts\\j'],['tsi','ts\\i'],['kw','kw'],['gw','gw'],
      ['hyen','hjen'],['tyen','tjen'],['hwa','xwa'],
      ['hy','hj'],['dz','dz'],['ts','ts'],
      ['zh','Z'],['sh','S'],['ch','tS'],['ny','J'],
      ['ā','a:'],  ['ē','e:'], ['ī','i:'], ['ō','o:'], ['ū','u:'],
      ['ð','D'],['þ','T'],['ŋ','N'],
      ['a','a'],['e','e'],['i','i'],['o','o'],['u','u'],['y','y'],
      ['b','b'],['d','d'],['f','f'],['g','g'],['h','h'],
      ['j','dZ'],['k','k'],['l','l'],['m','m'],['n','n'],
      ['p','p'],['r','r'],['s','s'],['t','t'],['v','v'],
      ['w','w'],['x','x'],['z','z'],
    ];

    function applyMap(text, map) {
      let result = '', i = 0;
      const s = text.toLowerCase();
      while (i < s.length) {
        let matched = false;
        for (const [from, to] of map) {
          if (s.startsWith(from, i)) {
            result += to; i += from.length; matched = true; break;
          }
        }
        if (!matched) { result += s[i]; i++; }
      }
      return result;
    }
    function toIPA(t)    { return '/​' + applyMap(t, IPA_MAP) + '​/'; }
    function toEspeak(t) { return '[[' + applyMap(t, ESP_MAP) + ']]'; }

    const inputEl = document.getElementById('inputText');
    const ipaEl   = document.getElementById('ipaDisplay');
    inputEl.addEventListener('input', () => {
      ipaEl.textContent = inputEl.value.trim() ? toIPA(inputEl.value.trim()) : '/…/';
    });
    ipaEl.textContent = toIPA(inputEl.value.trim());

    const speedRange = document.getElementById('speedRange');
    const pitchRange = document.getElementById('pitchRange');
    speedRange.addEventListener('input', () => document.getElementById('speedVal').textContent = speedRange.value);
    pitchRange.addEventListener('input', () => document.getElementById('pitchVal').textContent = pitchRange.value);

    document.getElementById('phonemeTable').innerHTML =
      IPA_MAP.slice(0,18).map(([iz,ipa],i) =>
        `<tr><td><b>${iz}</b></td><td>${ipa}</td><td><code>${ESP_MAP[i]?.[1]??''}</code></td></tr>`
      ).join('');

    const playBtn  = document.getElementById('playBtn');
    const statusEl = document.getElementById('status');
    const SAMPLE_RATE = 22050;
    // Tempo di silenzio dopo l'ultimo chunk prima di considerare lo stream finito
    const END_TIMEOUT_MS = 300;

    function mergeChunks(chunks) {
      const total = chunks.reduce((s, b) => s + b.byteLength, 0);
      const merged = new Uint8Array(total);
      let offset = 0;
      for (const b of chunks) { merged.set(new Uint8Array(b), offset); offset += b.byteLength; }
      return new Int16Array(merged.buffer);
    }

    function pcmToWav(pcm, sampleRate) {
      const dataSize = pcm.length * 2;
      const buf = new ArrayBuffer(44 + dataSize);
      const v = new DataView(buf);
      const w = (o, s) => { for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
      w(0,'RIFF'); v.setUint32(4, 36+dataSize, true);
      w(8,'WAVE'); w(12,'fmt ');
      v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
      v.setUint32(24,sampleRate,true); v.setUint32(28,sampleRate*2,true);
      v.setUint16(32,2,true); v.setUint16(34,16,true);
      w(36,'data'); v.setUint32(40,dataSize,true);
      new Int16Array(buf,44).set(pcm);
      return new Blob([buf], {type:'audio/wav'});
    }

    function playBlob(blob) {
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      audio.onended = () => {
        URL.revokeObjectURL(url);
        playBtn.disabled = false; playBtn.textContent = '🔊 Play';
        statusEl.textContent = '';
      };
      audio.onerror = () => {
        statusEl.textContent = '❌ Playback error';
        playBtn.disabled = false; playBtn.textContent = '🔊 Play';
      };
      const p = audio.play();
      if (p && p.catch) p.catch(e => {
        dbg('play() rejected: ' + e);
        statusEl.textContent = '❌ ' + e;
        playBtn.disabled = false; playBtn.textContent = '🔊 Play';
      });
    }

    let tts = null;
    const script = document.createElement('script');
    script.src = '/izaki-dictionary/scripts/espeak/espeakng.min.js';
    script.onload = () => {
      try {
        tts = new eSpeakNG(
          '/izaki-dictionary/scripts/espeak/espeakng.worker.js',
          function onReady() {
            dbg('onReady ✅');
            playBtn.disabled = false;
            playBtn.textContent = '🔊 Play';
            statusEl.textContent = '✅ eSpeak-ng ready!';
            setTimeout(() => statusEl.textContent = '', 2500);
          }
        );
      } catch(e) {
        statusEl.textContent = '❌ Init error: ' + e;
        dbg('EXCEPTION: ' + e);
      }
    };
    document.head.appendChild(script);

    playBtn.addEventListener('click', () => {
      if (!tts) return;
      const raw = inputEl.value.trim();
      if (!raw) return;

      const espText = toEspeak(raw);
      dbg('Synthesizing: ' + espText);
      playBtn.disabled = true;
      playBtn.textContent = '▶️…';
      statusEl.textContent = '▶️ ' + toIPA(raw);

      tts.set_voice(document.getElementById('voiceSelect').value, () => {
        tts.set_rate(parseInt(speedRange.value), () => {
          tts.set_pitch(parseInt(pitchRange.value), () => {

            const chunks = [];
            let done = false;
            let endTimer = null;

            function finish() {
              if (done) return;
              done = true;
              dbg('Stream end. chunks=' + chunks.length
                + ' total=' + chunks.reduce((s,b) => s+b.byteLength, 0) + ' bytes');
              if (chunks.length === 0) {
                statusEl.textContent = '⚠️ No audio received';
                playBtn.disabled = false; playBtn.textContent = '🔊 Play';
                return;
              }
              const pcm = mergeChunks(chunks);
              dbg('Playing ' + pcm.length + ' samples (' + (pcm.length/SAMPLE_RATE).toFixed(2) + 's)');
              playBlob(pcmToWav(pcm, SAMPLE_RATE));
            }

            tts.synthesize(espText, function(samples, events) {
              if (done) return;

              // Segnale di fine esplicito
              if (samples == null) { clearTimeout(endTimer); finish(); return; }

              // Chunk PCM valido
              if (samples instanceof ArrayBuffer && samples.byteLength > 0) {
                chunks.push(samples);
                dbg('chunk ' + chunks.length + ': ' + samples.byteLength + 'B');
              }

              // Reset del timer di idle: se non arriva nulla per END_TIMEOUT_MS, consideriamo finito
              clearTimeout(endTimer);
              endTimer = setTimeout(finish, END_TIMEOUT_MS);
            });

          });
        });
      });
    });

  })();
  </script>
</body>
</html>
