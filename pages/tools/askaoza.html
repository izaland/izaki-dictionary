<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Askaoza Converter - Izaki Dictionary</title>
  
  <!-- Bulma CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  
  <!-- Preconnect per Google Fonts (migliora velocità caricamento) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Font gujarati con fallback multipli per compatibilità mobile -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Gujarati:wght@400;600&display=block">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600&display=block">

  <!-- Navbar e stile Izaki-dictionary -->
  <link rel="stylesheet" href="/izaki-dictionary/styles/main.css">
  
<style>
  .askaoza-sample {
    font-family: "Anek Gujarati", "Noto Sans Gujarati", "Shruti", "Gujarati Sangam MN", system-ui, sans-serif;
    font-size: 1.8rem;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  /* NUOVO: migliora interlinea del titolo hero */
  .hero .title {
    line-height: 1.3;        /* o 1.25 se vuoi ancora più spazio */
    margin-bottom: 0.4rem;   /* separa titolo e sottotitolo */
  }

  .hero .subtitle {
    line-height: 1.4;
  }

  .subtitle-ja {
    font-size: 0.85em;
    opacity: 0.9;
  }

  /* resto come prima... */
</style>
</head>

<body>
  <!-- NAVBAR -->
  <div id="navbar"></div>

  <!-- HERO SECTION -->
  <section class="hero is-medium is-link">
    <div class="hero-body has-text-centered">
      <p class="title">
        Askaoza Converter
        <span class="subtitle-ja">阿須和沙變換</span>
      </p>
      <p class="subtitle">
        Latin ↔ Askaoza transliteration
        <br>
        <span class="subtitle-ja">羅馬字・阿須和沙轉写</span>
      </p>
    </div>
  </section>

  <!-- CONTENT SECTION -->
  <section class="section">
    <div class="container">
      <div class="columns">
        <!-- LATIN INPUT -->
        <div class="column">
          <h3 class="title is-5">Latin → Askaoza</h3>
          <div class="field has-addons is-flex is-align-items-center">
            <div class="control is-expanded input-wrapper">
              <textarea id="latinInput" class="textarea" rows="5"
                placeholder="Write in alphabet the text you want to convert in Askaoza..."></textarea>
              <button type="button"
                      id="clearLatin"
                      class="clear-btn"
                      aria-label="Clear input">×</button>
            </div>
          </div>
          <button id="toAskaozaBtn" class="button is-link is-light mt-2">
            Convert to Askaoza
          </button>
          <div id="askaozaOutput" class="notification is-white askaoza-sample mt-3"></div>
        </div>

        <!-- ASKAOZA INPUT -->
        <div class="column">
          <h3 class="title is-5">Askaoza → Latin</h3>
          <textarea id="askaozaInput" class="textarea askaoza-sample" rows="5"
            placeholder="Paste or type Askaoza text here..."></textarea>
          <button id="toLatinBtn" class="button is-link is-light mt-2">
            Latinize
          </button>
          <div id="latinOutput" class="notification is-white mt-3"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Script originali -->
  <script src="/izaki-dictionary/scripts/askaoza.js"></script>
  <script src="/izaki-dictionary/scripts/script.js"></script>

  <!-- JS aggiuntivo per la X e per usare l’API esistente -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const latinInput = document.getElementById('latinInput');
      const clearLatin = document.getElementById('clearLatin');
      const toAskaozaBtn = document.getElementById('toAskaozaBtn');

      if (clearLatin && latinInput) {
        clearLatin.addEventListener('click', function () {
          latinInput.value = '';

          // Se il convertitore funziona sul click del bottone,
          // richiamiamo il click per aggiornare anche l’output.
          if (toAskaozaBtn) {
            toAskaozaBtn.click();
          }
        });
      }
    });
  </script>
</body>
</html>
