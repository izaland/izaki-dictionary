<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izaki Noun Declensor - Izaki Dictionary</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <!-- o il tuo CSS locale -->
</head>
<body>
    <!-- NAVBAR -->
    <div id="navbar"></div>

    <!-- HERO SECTION -->
    <section class="hero is-medium is-link">
        <div class="hero-body">
            <p class="title">Noun Declension Tool<br>名詞変化ツール</p>
            <p class="subtitle">Decline Izaki nouns automatically<br>伊座希語名詞を自動変化</p>
        </div>
    </section>

    <!-- MAIN CONTENT -->
    <div class="box m-5">
        <div class="columns">
            <div class="column">
                <h2 class="title is-4">Input<br>入力</h2>
                <div class="field">
                    <div class="control">
                        <input class="input is-large" id="nounInput" type="text" 
                               placeholder="Type a noun (romaji or Byakuzhi)<br>名詞を入力 (ローマ字または百字)">
                    </div>
                </div>
                <div class="field">
                    <div class="control">
                        <button id="declineBtn" class="button is-link is-large is-fullwidth">
                            Decline Noun<br>名詞変化
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="column">
                <h2 class="title is-4">Lemma Info<br>語幹情報</h2>
                <div class="notification" id="lemmaInfo"></div>
                
                <h2 class="title is-4 mt-5">Declined Forms<br>変化形</h2>
                <div class="table-container">
                    <table id="formsTable" class="table is-striped is-fullwidth">
                        <thead>
                            <tr>
                                <th>Case / 格</th>
                                <th>Form / 形</th>
                                <th>Rule / 規則</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- riempito via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="/izaki-dictionary/scripts/script.js"></script>
    <script>
        // Il tuo script declinatore qui (lo stesso di prima)
        document.addEventListener('DOMContentLoaded', function() {
            const nounInput = document.getElementById('nounInput');
            const declineBtn = document.getElementById('declineBtn');
            const lemmaInfo = document.getElementById('lemmaInfo');
            const formsTable = document.getElementById('formsTable');
            
let dictionary = null;

async function loadDictionary() {
  try {
    const response = await fetch('../../data/dictionary.json');
    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }
    dictionary = await response.json();
    console.log('Dizionario caricato, voci:', Object.keys(dictionary).length);
  } catch (e) {
    console.error('Errore nel caricamento del dizionario:', e);
  }
}

// chiama loadDictionary() quando la pagina è pronta
document.addEventListener('DOMContentLoaded', loadDictionary);

// ===============================
// Utility: riconoscere i nomi
// ===============================

function isNoun(entry) {
  if (!entry || entry.pos == null) return false;
  const raw = String(entry.pos).toLowerCase();
  // nel JSON i POS sono tipo ": adj =", ": n =", ecc.
  // filtriamo i sostantivi
  return raw.includes(': n =');
}

// ===============================
// Lookup di un lemma
// ===============================

function lookupLemma(input) {
  if (!dictionary) {
    console.warn('Dizionario non ancora caricato');
    return null;
  }

  const normalized = input.toLowerCase().trim();
  let result = null;

  for (let id in dictionary) {
    const entry = dictionary[id];
    if (!isNoun(entry)) continue;

    const lemma = (entry.lemma || '').toLowerCase();
    if (!lemma) continue;

    if (
      lemma === normalized ||
      lemma.includes(normalized) ||
      normalized.includes(lemma)
    ) {
      result = {
        lemma: entry.lemma,
        english: Array.isArray(entry.english)
          ? entry.english.join(', ')
          : (entry.english || ''),
        italian: Array.isArray(entry.italian)
          ? entry.italian.join(', ')
          : (entry.italian || ''),
        byakuzhi: entry.byakuzhi || '',
        pos: entry.pos
      };
      break;
    }
  }

  return result;
}
            
            function analyzeEnding(lemma) {
                const clean = lemma.replace(/[^a-zāēīōū]/g, '').toLowerCase();
                const lastChar = clean.slice(-1);
                const lastTwo = clean.slice(-2);
                const vowels = 'aeiouāēīōū';
                
                const isVowelEnd = vowels.includes(lastChar);
                const isLongVowelEnd = 'āēīōū'.includes(lastChar);
                const isConsonantEnd = !isVowelEnd;
                const finalConsonant = isConsonantEnd ? lastChar : null;
                const prevConsonant = lastTwo[0] && !vowels.includes(lastTwo[0]) ? lastTwo[0] : null;
                
                return {
                    clean,
                    isVowelEnd,
                    isLongVowelEnd,
                    isConsonantEnd,
                    finalConsonant,
                    prevConsonant,
                    lastVowel: isVowelEnd ? lastChar : null
                };
            }
            
            function declineNoun(lemma, dictInfo = null) {
                const analysis = analyzeEnding(lemma);
                const forms = {};
                
                forms.nominative = analysis.clean;
                
                if (analysis.isVowelEnd) {
                    forms.genitive = analysis.clean + (analysis.isLongVowelEnd ? 'hun' : 'n');
                } else {
                    forms.genitive = analysis.clean + 'un';
                }
                
                if (analysis.isVowelEnd && !analysis.isLongVowelEnd) {
                    const vowelMap = { 'a': 'ā', 'e': 'ē', 'i': 'ī', 'o': 'ō', 'u': 'ū' };
                    forms.accusative = analysis.clean.slice(0, -1) + vowelMap[analysis.lastVowel];
                } else {
                    forms.accusative = analysis.clean;
                }
                
                forms.dative = analysis.isConsonantEnd && analysis.finalConsonant === 'n' 
                    ? analysis.clean + 'ni' 
                    : analysis.clean + 'i';
                
                if (analysis.isVowelEnd) {
                    forms.essive = analysis.clean + (analysis.isLongVowelEnd ? 'hus' : 's');
                } else {
                    forms.essive = analysis.clean + 'us';
                }
                
                if (analysis.isVowelEnd) {
                    forms.allative = analysis.clean + (analysis.isLongVowelEnd ? 'hur' : 'r');
                } else {
                    forms.allative = analysis.clean + 'ur';
                }
                
                if (analysis.isVowelEnd) {
                    forms.ablative = analysis.clean + (analysis.isLongVowelEnd ? 'hul' : 'l');
                } else {
                    forms.ablative = analysis.clean + 'ul';
                }
                
                const vowelProgression = {
                    'a': 'e', 'e': 'i', 'i': 'o', 'o': 'u', 'u': 'a',
                    'ā': 'e', 'ē': 'i', 'ī': 'o', 'ō': 'u', 'ū': 'a'
                };
                if (analysis.isVowelEnd) {
                    forms.instrumental = analysis.clean.slice(0, -1) + vowelProgression[analysis.lastVowel];
                } else {
                    forms.instrumental = analysis.clean + 'e';
                }
                
                return { forms, analysis, dictInfo };
            }
            
            function updateInterface(input, result) {
                if (result.dictInfo) {
                    lemmaInfo.innerHTML = `
                        <strong>${result.dictInfo.lemma}</strong>
                        ${result.dictInfo.byakuzhi ? `<br><small>百字: ${result.dictInfo.byakuzhi}</small>` : ''}
                        <br><em>${result.dictInfo.english}</em>
                    `;
                    lemmaInfo.className = 'notification is-primary';
                } else {
                    lemmaInfo.innerHTML = `<em>${input}</em><br>(Not found; using general rules / 辞書に見つかりません。一般規則使用)`;
                    lemmaInfo.className = 'notification is-warning';
                }
                
                const tbody = formsTable.querySelector('tbody');
                tbody.innerHTML = '';
                
                const cases = [
                    { key: 'nominative', name: 'Nominative / 主格', note: '-' },
                    { key: 'genitive', name: 'Genitive / 属格', note: '-n/-un' },
                    { key: 'accusative', name: 'Accusative / 対格', note: 'Vowel lengthen' },
                    { key: 'dative', name: 'Dative / 与格', note: '+i' },
                    { key: 'essive', name: 'Essive / 処格', note: '-s/-us' },
                    { key: 'allative', name: 'Allative / 向格', note: '-r/-ur' },
                    { key: 'ablative', name: 'Ablative / 出格', note: '-l/-ul' },
                    { key: 'instrumental', name: 'Instrumental / 具格', note: 'Vowel shift' }
                ];
                
                cases.forEach(c => {
                    const row = tbody.insertRow();
                    row.innerHTML = `
                        <td>${c.name}</td>
                        <td><strong>${result.forms[c.key]}</strong></td>
                        <td>${c.note}</td>
                    `;
                });
            }
            
            declineBtn.addEventListener('click', async function() {
                const input = nounInput.value.trim();
                if (!input) return;
                
                const dictMatch = lookupLemma(input);
                const result = declineNoun(input, dictMatch);
                updateInterface(input, result);
            });
            
            nounInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') declineBtn.click();
            });
            
            loadDictionary();
        });
    </script>
</body>
</html>
