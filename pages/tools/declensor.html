<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Izaki Noun Declensor 華邦語名詞曲用表</title>
<link rel="stylesheet" href="../../assets/bulma.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Gujarati:wght@400;600&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600&display=block">
<style>
  html[data-theme="light"] {
    --bg: #f7ecd8;
    --panel: rgba(255, 250, 230, 0.96);
    --panel-2: rgba(255, 250, 230, 0.82);
    --input: #fff8e0;
    --border: #d4b87c;
    --text: #4b3b2a;
    --text-2: #3e2f1c;
    --lemma: #4b2f1e;
    --ask: #8b6f47;
    --ipa: #7a5e3a;
    --muted: #6b5a45;
    --accent: #d4b87c;
    --accent-hover: #c4a86c;
    --table-head: #f0e8d0;
    --table-bg: rgba(255,255,255,0.55);
    --shadow: rgba(0,0,0,0.10);
  }
  html[data-theme="dark"] {
    --bg: #16120d;
    --panel: rgba(30, 25, 20, 0.96);
    --panel-2: rgba(40, 35, 28, 0.85);
    --input: #2a2218;
    --border: #5a4a32;
    --text: #eadbc4;
    --text-2: #d8c7ac;
    --lemma: #f5e0c0;
    --ask: #d4b87c;
    --ipa: #c0a87a;
    --muted: #b5a389;
    --accent: #5a4a32;
    --accent-hover: #6a5a42;
    --table-head: #3a302a;
    --table-bg: rgba(35,30,25,0.6);
    --shadow: rgba(0,0,0,0.35);
  }
  body {
    background: var(--bg);
    font-family: "Merriweather", Georgia, serif;
    margin: 0;
    color: var(--text);
    transition: background-color .2s ease, color .2s ease;
  }
  #container {
    width: min(1100px, 92%);
    margin: 2rem auto;
    padding: 2rem 2.4rem 2.6rem;
    background: var(--panel);
    border-radius: 12px;
    box-shadow: 0 5px 20px var(--shadow);
  }
  h1.title {
    text-align: center;
    color: var(--text);
    margin-bottom: .5rem;
    font-size: 2.2rem;
  }
  .subtitle-note {
    text-align: center;
    color: var(--muted);
    margin: 0 auto 1.6rem;
    max-width: 780px;
    font-size: .98rem;
  }
  .search-wrap {
    position: relative;
    margin-bottom: 1.2rem;
  }
  .input {
    background: var(--input);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: .65rem .9rem;
    width: 100%;
    box-sizing: border-box;
    min-height: 48px;
    font-size: 1rem;
    font-family: inherit;
    transition: border-color .2s ease;
  }
  .input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(212,184,124,.18);
  }
  .search-hint {
    color: var(--muted);
    margin-top: .55rem;
    font-size: .92rem;
  }
  .suggestions {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    z-index: 20;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 10px 24px var(--shadow);
    overflow: hidden;
    display: none;
    max-height: 360px;
    overflow-y: auto;
  }
  .suggestions.show { display: block; }
  .suggestion {
    padding: .8rem .95rem;
    border-bottom: 1px solid rgba(212,184,124,.35);
    cursor: pointer;
    background: transparent;
    transition: background .12s ease;
  }
  .suggestion:last-child { border-bottom: none; }
  .suggestion:hover, .suggestion.active { background: var(--panel-2); }
  .suggestion-lemma {
    font-weight: bold;
    color: var(--lemma);
    font-size: 1.03rem;
  }
  .suggestion-meta {
    margin-top: .18rem;
    color: var(--muted);
    font-size: .88rem;
  }
  /* Hero card shown after selection */
  .hero-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.1rem 1.2rem;
    margin: 1.2rem 0 1rem;
  }
  .hero-main {
    display: flex;
    gap: .8rem;
    flex-wrap: wrap;
    align-items: baseline;
  }
  .hl-lemma {
    font-size: 1.75rem;
    font-weight: bold;
    color: var(--lemma);
  }
  .hl-askaoza {
    font-family: "Anek Gujarati", "Noto Sans Gujarati", "Shruti", system-ui, sans-serif;
    font-size: 1.5rem;
    color: var(--ask);
  }
  .hl-ipa {
    color: var(--ipa);
    font-style: italic;
    font-size: 1rem;
  }
  .hero-meta {
    margin-top: .45rem;
    color: var(--text-2);
    font-size: .97rem;
  }
  .hero-glosses {
    margin-top: .3rem;
    color: var(--text-2);
    font-size: .97rem;
  }
  /* Declension table */
  .section-title {
    margin: 1.5rem 0 .75rem;
    font-size: 1.08rem;
    font-weight: bold;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    padding-bottom: .35rem;
  }
  .table-wrap {
    background: var(--table-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    padding: .72rem .75rem;
    border-bottom: 1px solid rgba(212,184,124,.35);
    text-align: left;
    vertical-align: top;
  }
  th {
    background: var(--table-head);
    color: var(--text);
    font-size: .9rem;
    font-weight: bold;
  }
  tbody tr:last-child td { border-bottom: none; }
  .td-case {
    font-weight: bold;
    color: var(--text);
    white-space: nowrap;
    width: 130px;
  }
  .form-latin {
    font-weight: bold;
    color: var(--lemma);
    display: block;
  }
  .form-ask {
    margin-top: .16rem;
    color: var(--ask);
    font-size: 1.1rem;
    font-family: "Anek Gujarati", "Noto Sans Gujarati", "Shruti", system-ui, sans-serif;
  }
  /* Empty / error state */
  .empty-state {
    text-align: center;
    color: var(--muted);
    background: var(--panel-2);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 2.4rem 1rem;
    margin-top: 1.1rem;
    font-size: .98rem;
  }
  @media (max-width: 720px) {
    #container { padding: 1.35rem 1rem 1.5rem; }
    h1.title { font-size: 1.75rem; }
    .hl-lemma { font-size: 1.45rem; }
    th, td { padding: .6rem .5rem; font-size: .91rem; }
    .td-case { width: 100px; }
  }
</style>
</head>
<body>

<div id="navbar"></div>
<script src="/izaki-dictionary/scripts/script.js"></script>

<div id="container">
  <h1 class="title">Izaki Noun Declensor 華邦語名詞曲用表</h1>
  <p class="subtitle-note">
    Search for an Izaki noun by lemma, English gloss, or Italian gloss.
    Results appear after 3 characters — select one to see the full declension table.
  </p>

  <div class="search-wrap">
    <input class="input" type="text" id="search" autocomplete="off"
           placeholder="🔎 Search lemma or translation…">
    <div id="suggestions" class="suggestions"></div>
    <div class="search-hint">Keyboard: ↑ ↓ to navigate, Enter to select, Esc to close.</div>
  </div>

  <div id="selected-output">
    <div class="empty-state">Type at least 3 letters above to search for a noun.</div>
  </div>
</div>

<script src="/izaki-dictionary/scripts/askaoza-engine.js"></script>
<script>
/* ── helpers ─────────────────────────────────────────────────────────── */
function norm(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function startsWith(text, q) {
  if (!text || !q) return false;
  const t = norm(text);
  if (t.startsWith(q)) return true;
  return t.split(/\s+/).some(w => w.startsWith(q));
}
function contains(text, q) {
  return text ? norm(text).includes(q) : false;
}
function isNoun(pos) {
  if (!pos) return false;
  const p = pos.toLowerCase().trim();
  return p === 'n' || p.startsWith('n=') || p.includes('noun');
}
function ipaToRomaji(ipa) {
  if (!ipa) return '';
  let r = ipa;
  [[/aː/g,'ā'],[/eː/g,'ē'],[/iː/g,'ī'],[/oː/g,'ō'],[/uː/g,'ū'],
   [/a/g,'a'],[/e/g,'e'],[/i/g,'i'],[/o/g,'o'],[/u/g,'u'],
   [/y/g,'y'],[/w/g,'w'],[/dz/g,'Ð'],[/ts/g,'TS'],[/ʒ/g,'ZH'],
   [/dʒ/g,'J'],[/f/g,'F'],[/v/g,'V'],[/k/g,'K'],[/ɡ/g,'G'],
   [/h/g,'H'],[/l/g,'L'],[/m/g,'M'],[/n/g,'N'],[/p/g,'P'],
   [/b/g,'B'],[/s/g,'S'],[/t/g,'T'],[/z/g,'Z'],[/tɕ/g,'CH'],
   [/ʃ/g,'SH'],[/ɾ/g,'R'],[/r/g,'R']
  ].forEach(([re,rep]) => { r = r.replace(re, rep); });
  return r;
}
if (typeof toAskaozaText !== 'function') {
  window.toAskaozaText = t => t || '';
}

/* ── declension engine ───────────────────────────────────────────────── */
const VOWELS = 'aeiouāēīōū';
const LONG   = 'āēīōū';

function analyze(lemma) {
  const clean = (lemma || '').replace(/[^a-zāēīōū]/gi, '').toLowerCase();
  const last  = clean.slice(-1);
  const vowelMatches = clean.match(/[aeiouāēīōū]/g) || [];
  const lastVowel = vowelMatches.length ? vowelMatches[vowelMatches.length - 1] : null;
  const isV = VOWELS.includes(last);
  return {
    clean, last, lastVowel,
    isV, isLong: LONG.includes(last), isC: clean ? !isV : false
  };
}

function instrumental(lemma) {
  const a = analyze(lemma);
  const b = a.clean;
  if (!b) return '';
  if (b.endsWith('ai'))  return b + 'yo';
  if (b.endsWith('au'))  return b.slice(0,-1) + 'wa';
  if (b.endsWith('ea'))  return b + 'e';
  const lv = a.lastVowel;
  if (a.isV) {
    if (lv==='a'||lv==='ā') return b + 'e';
    if (lv==='e'||lv==='ē') return b + 'i';
    if (lv==='i'||lv==='ī') return b.slice(0,-1) + 'yo';
    if (lv==='o'||lv==='ō') return b + 'u';
    if (lv==='u'||lv==='ū') return b.slice(0,-1) + 'wa';
  }
  const prog = {a:'e',e:'i',i:'o',o:'u',u:'a',ā:'e',ē:'i',ī:'o',ō:'u',ū:'a'};
  if (a.isC && lv && prog[lv]) return b + prog[lv];
  return b + 'e';
}

function decline(lemma) {
  const a = analyze(lemma);
  const b = a.clean;
  if (!b) return { singular:{}, plural:{} };
  const S = {};
  S.nom = b;
  S.gen = a.isV ? b + (a.isLong ? 'hun' : 'n') : b + 'un';
  if (a.isV && !a.isLong) {
    const vm = {a:'ā',e:'ē',i:'ī',o:'ō',u:'ū'};
    S.acc = b.slice(0,-1) + (vm[a.last] || a.last);
  } else S.acc = b;
  S.dat = b + 'i';
  S.ess = a.isV ? b + (a.isLong ? 'hus' : 's') : b + 'us';
  S.all = a.isV ? b + (a.isLong ? 'hur' : 'r') : b + 'ur';
  S.abl = a.isV ? b + (a.isLong ? 'hul' : 'l') : b + 'ul';
  S.ins = instrumental(b);

  const P = {};
  if (a.isC)        P.nom = b + b.slice(-1);
  else if (a.isLong) P.nom = b + 'hin';
  else               P.nom = b + a.last + 'n';
  P.gen = b + (a.isC ? 'en' : 'in');
  P.acc = b + (a.isC ? 'ta' : 'ita');
  P.dat = b + 'hi';
  P.ess = b + (a.isC ? 'es' : 'is');
  P.all = b + (a.isC ? 'er' : 'ir');
  P.abl = b + (a.isC ? 'el' : 'il');
  P.ins = S.ins + 'i';
  return { singular: S, plural: P };
}

/* ── UI state ────────────────────────────────────────────────────────── */
const searchEl = document.getElementById('search');
const suggBox  = document.getElementById('suggestions');
const output   = document.getElementById('selected-output');
let nouns = [], suggs = [], activeIdx = -1;

function hideSugg() {
  suggBox.classList.remove('show');
  suggBox.innerHTML = '';
  suggs = []; activeIdx = -1;
}

function pick(entry) {
  searchEl.value = entry.lemma || '';
  hideSugg();
  showEntry(entry);
}

function showEntry(e) {
  const f    = decline(e.lemma || '');
  const ask  = toAskaozaText(e.lemma || '');
  const en   = (e.english || []).join(', ');
  const it   = (e.italian  || []).join(', ');
  const rom  = ipaToRomaji(e.ipa || '');
  const CASES = [
    ['Nominative','nom'],['Genitive','gen'],['Accusative','acc'],
    ['Dative','dat'],['Essive','ess'],['Allative','all'],
    ['Ablative','abl'],['Instrumental','ins']
  ];
  output.innerHTML = `
    <div class="hero-card">
      <div class="hero-main">
        <span class="hl-lemma">${e.lemma || '—'}</span>
        <span class="hl-askaoza">${ask}</span>
        <span class="hl-ipa">${e.ipa || ''}</span>
      </div>
      <div class="hero-meta">
        <strong>POS:</strong> ${e.pos || '—'}${rom ? ` &nbsp;·&nbsp; <strong>Romaji:</strong> ${rom}` : ''}
      </div>
      <div class="hero-glosses">
        ${en ? `<strong>EN:</strong> ${en}` : ''}${en && it ? ' &nbsp;·&nbsp; ' : ''}${it ? `<strong>IT:</strong> ${it}` : ''}
      </div>
    </div>

    <div class="section-title">Declension 曲用表</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Case</th>
            <th>Singular</th>
            <th>Plural</th>
          </tr>
        </thead>
        <tbody>
          ${CASES.map(([label, key]) => {
            const sg = f.singular[key] || '—';
            const pl = f.plural[key]   || '—';
            return `<tr>
              <td class="td-case">${label}</td>
              <td>
                <span class="form-latin">${sg}</span>
                <div class="form-ask">${sg !== '—' ? toAskaozaText(sg) : ''}</div>
              </td>
              <td>
                <span class="form-latin">${pl}</span>
                <div class="form-ask">${pl !== '—' ? toAskaozaText(pl) : ''}</div>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}

function showSuggs(items) {
  suggs = items; activeIdx = -1;
  if (!items.length) {
    suggBox.innerHTML = '<div class="suggestion"><div class="suggestion-lemma">No matches</div><div class="suggestion-meta">Try a different lemma or gloss.</div></div>';
    suggBox.classList.add('show');
    return;
  }
  suggBox.innerHTML = items.map((e,i) => `
    <div class="suggestion" data-i="${i}">
      <div class="suggestion-lemma">${e.lemma || '—'}</div>
      <div class="suggestion-meta">${e.ipa || '—'} · ${(e.english||[]).slice(0,2).join(', ')}${(e.italian||[]).length ? ' · '+(e.italian||[]).slice(0,2).join(', ') : ''}</div>
    </div>`).join('');
  suggBox.classList.add('show');
  suggBox.querySelectorAll('.suggestion').forEach(el => {
    el.addEventListener('click', () => pick(suggs[+el.dataset.i]));
  });
}

function getMatches(q) {
  if (q.length < 3) return [];
  const pre = [], mid = [];
  nouns.forEach(e => {
    const en = e.english || [], it = e.italian || [];
    const hit = startsWith(e.lemma,q) || en.some(w=>startsWith(w,q)) || it.some(w=>startsWith(w,q));
    if (hit) pre.push(e);
    else if (contains(e.lemma,q) || en.some(w=>contains(w,q)) || it.some(w=>contains(w,q))) mid.push(e);
  });
  return pre.concat(mid).sort((a,b)=>(a.lemma||'').localeCompare(b.lemma||'')).slice(0,14);
}

searchEl.addEventListener('input', () => {
  const q = norm(searchEl.value.trim());
  if (q.length < 3) {
    hideSugg();
    output.innerHTML = '<div class="empty-state">Type at least 3 letters above to search for a noun.</div>';
    return;
  }
  showSuggs(getMatches(q));
});

searchEl.addEventListener('keydown', ev => {
  if (!suggs.length) return;
  if (ev.key === 'ArrowDown') { ev.preventDefault(); activeIdx = (activeIdx+1) % suggs.length; }
  else if (ev.key === 'ArrowUp') { ev.preventDefault(); activeIdx = (activeIdx-1+suggs.length) % suggs.length; }
  else if (ev.key === 'Enter') { if (activeIdx >= 0) { ev.preventDefault(); pick(suggs[activeIdx]); } return; }
  else if (ev.key === 'Escape') { hideSugg(); return; }
  else return;
  [...suggBox.querySelectorAll('.suggestion')].forEach((el,i) => el.classList.toggle('active', i===activeIdx));
});

document.addEventListener('click', ev => {
  if (!suggBox.contains(ev.target) && ev.target !== searchEl) hideSugg();
});

/* ── load data ───────────────────────────────────────────────────────── */
fetch('../../data/dictionary.json')
  .then(r => r.json())
  .then(data => {
    nouns = data
      .filter(e => isNoun(e.pos) && e.lemma)
      .sort((a,b) => (a.lemma||'').localeCompare(b.lemma||''));
  })
  .catch(() => {
    output.innerHTML = '<div class="empty-state">⚠️ Error loading dictionary data. Please try refreshing the page.</div>';
  });
</script>

</body>
</html>
