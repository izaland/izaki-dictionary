<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izaki Noun Declensor - Izaki Dictionary</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <!-- o il tuo CSS locale -->
</head>
<body>
    <!-- NAVBAR -->
    <div id="navbar"></div>

    <!-- HERO SECTION -->
    <section class="hero is-medium is-link">
        <div class="hero-body">
            <p class="title">Noun Declension Tool<br>名詞曲用道具</p>
            <p class="subtitle">Decline Izaki nouns automatically<br><br>華邦語名詞: 自動曲用</p>
        </div>
    </section>

    <!-- MAIN CONTENT -->
    <div class="box m-5">
        <div class="columns">
            <div class="column">
                <h2 class="title is-4">Input<br>入力</h2>
                <div class="field">
                    <div class="control">
                        <input class="input is-large" id="nounInput" type="text" 
                               placeholder="Type a noun (romaji or Byakuzhi)<br>名詞: 入力 (ローマ字または百字)">
                    </div>
                </div>
                <div class="field">
                    <div class="control">
                        <button id="declineBtn" class="button is-link is-large is-fullwidth">
                            Decline Noun<br>名詞曲用
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="column">
                <h2 class="title is-4">Lemma Info<br>語幹情報</h2>
                <div class="notification" id="lemmaInfo"></div>
                
                <h2 class="title is-4 mt-5">Declined Forms<br>變化形</h2>
                <div class="table-container">
                    <table id="formsTable" class="table is-striped is-fullwidth">
                        <thead>
                            <tr>
                                <th>Case / 格</th>
                                <th>Form / 形</th>
                                <th>Rule / 規則</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- riempito via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
 <script src="/izaki-dictionary/scripts/script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const nounInput  = document.getElementById('nounInput');
    const declineBtn = document.getElementById('declineBtn');
    const lemmaInfo  = document.getElementById('lemmaInfo');
    const formsTable = document.getElementById('formsTable');

    // ===============================
    // Dizionario
    // ===============================

    let dictionary = null;

    async function loadDictionary() {
        try {
            const response = await fetch('../../data/dictionary.json');
            if (!response.ok) throw new Error('HTTP ' + response.status);
            dictionary = await response.json();
            console.log('Dizionario caricato, voci:', Object.keys(dictionary).length);
        } catch (e) {
            console.error('Errore nel caricamento del dizionario:', e);
        }
    }

    // ===============================
    // Utility: riconoscere i nomi
    // ===============================

    function isNoun(entry) {
        if (!entry || entry.pos == null) return false;
        const raw = String(entry.pos).toLowerCase();
        // nel JSON i POS sono tipo ": adj =", ": n =" ecc.
        return raw.includes(': n =');
    }

    // ===============================
    // Lookup di un lemma
    // ===============================

    function lookupLemma(input) {
        if (!dictionary) {
            console.warn('Dizionario non ancora caricato');
            return null;
        }

        const normalized = input.toLowerCase().trim();
        let result = null;

        for (let id in dictionary) {
            const entry = dictionary[id];
            if (!isNoun(entry)) continue;

            const lemma = (entry.lemma || '').toLowerCase();
            if (!lemma) continue;

            if (
                lemma === normalized ||
                lemma.includes(normalized) ||
                normalized.includes(lemma)
            ) {
                result = {
                    lemma:   entry.lemma,
                    english: Array.isArray(entry.english)
                        ? entry.english.join(', ')
                        : (entry.english || ''),
                    italian: Array.isArray(entry.italian)
                        ? entry.italian.join(', ')
                        : (entry.italian || ''),
                    byakuzhi: entry.byakuzhi || '',
                    pos: entry.pos
                };
                break;
            }
        }

        return result;
    }

    // ===============================
    // Analisi finale lemma
    // ===============================

    function analyzeEnding(lemma) {
        const clean = lemma.replace(/[^a-zāēīōū]/gi, '').toLowerCase();
        const lastChar = clean.slice(-1);
        const lastTwo  = clean.slice(-2);
        const vowels   = 'aeiouāēīōū';

        const isVowelEnd     = vowels.includes(lastChar);
        const isLongVowelEnd = 'āēīōū'.includes(lastChar);
        const isConsonantEnd = !isVowelEnd;
        const finalConsonant = isConsonantEnd ? lastChar : null;
        const prevConsonant  = lastTwo[0] && !vowels.includes(lastTwo[0]) ? lastTwo[0] : null;

        return {
            clean,
            isVowelEnd,
            isLongVowelEnd,
            isConsonantEnd,
            finalConsonant,
            prevConsonant,
            lastVowel: isVowelEnd ? lastChar : null
        };
    }

    // ===============================
    // Declinazioni SINGOLARE
    // ===============================

    function buildSingularCases(lemma) {
        const analysis = analyzeEnding(lemma);
        const forms = {};

        forms.nom = analysis.clean;

        // Genitivo sing.
        if (analysis.isVowelEnd) {
            forms.gen = analysis.clean + (analysis.isLongVowelEnd ? 'hun' : 'n');
        } else {
            forms.gen = analysis.clean + 'un';
        }

// Accusativo sing.
if (analysis.isVowelEnd && !analysis.isLongVowelEnd) {
  // vocali brevi: allungamento
  const vowelMap = { a:'ā', e:'ē', i:'ī', o:'ō', u:'ū' };
  forms.acc = analysis.clean.slice(0, -1) + vowelMap[analysis.lastVowel];
} else if (analysis.isConsonantEnd) {
  // finali in -s: +ū (tsaikis → tsaikīs)
  if (analysis.finalConsonant === 's') {
    // trova l’ultima vocale e allungala
    const m = analysis.clean.match(/([aeiou])s$/);
    if (m) {
      const v = m[1];
      const longMap = { a:'ā', e:'ē', i:'ī', o:'ō', u:'ū' };
      forms.acc = analysis.clean.slice(0,-2) + longMap[v];
    } else {
      forms.acc = analysis.clean;
    }
  } else {
    forms.acc = analysis.clean;
  }
} else {
  forms.acc = analysis.clean;
}


// Dativo sing.
if (analysis.isConsonantEnd && analysis.finalConsonant === 'n') {
  forms.dat = analysis.clean + 'ni';
} else if (analysis.isConsonantEnd && analysis.finalConsonant === 's') {
  // s + i → sshi → scritto "sshi"
  forms.dat = analysis.clean + 'shi'; // tsaikis → tsaikisshi (foneticamente)
} else {
  forms.dat = analysis.clean + 'i';
}


        // Essivo sing.
        if (analysis.isVowelEnd) {
            forms.ess = analysis.clean + (analysis.isLongVowelEnd ? 'hus' : 's');
        } else {
            forms.ess = analysis.clean + 'us';
        }

        // Allativo sing.
        if (analysis.isVowelEnd) {
            forms.all = analysis.clean + (analysis.isLongVowelEnd ? 'hur' : 'r');
        } else {
            forms.all = analysis.clean + 'ur';
        }

        // Ablativo sing.
        if (analysis.isVowelEnd) {
            forms.abl = analysis.clean + (analysis.isLongVowelEnd ? 'hul' : 'l');
        } else {
            forms.abl = analysis.clean + 'ul';
        }

// ===============================
// Strumentale singolare (corretto)
// ===============================

function buildInstrumentalSingular(lemma) {
  const a = analyzeEnding(lemma);
  const base = a.clean;

  // parole già in dittongo e casi speciali
  if (base.endsWith('ai')) return base + 'yo';        // sasatsai → sasatsayo
  if (base.endsWith('au')) return base.slice(0,-1) + 'wa'; // akau → akawa
  if (base.endsWith('ea')) return base + 'e';         // kea → keae
  if (base.endsWith('ao')) return base.slice(0,-2) + 'ō';  // hingao → hingō
  if (base.endsWith('eo')) return base.slice(0,-2) + 'eu'; // sāreo → sāreu
  if (base.endsWith('uo')) return base.slice(0,-2) + 'ū';  // tassuo → tassū
  if (/[ū]$/.test(base))  return base + 'a';          // haiyū → haiyūa

  const last = a.lastVowel;
  const cons = a.isConsonantEnd ? a.finalConsonant : '';

  // parole in vocale semplice
  if (a.isVowelEnd && !a.isConsonantEnd) {
    if (last === 'a' || last === 'ā') return base + 'e';          // miwa → miwae
    if (last === 'e' || last === 'ē') return base + 'i';          // oboe → oboei
    if (last === 'i' || last === 'ī') return base.slice(0,-1) + 'yo'; // sāri → sāryo
    if (last === 'o' || last === 'ō') return base + 'u';          // ahiro → ahirou
    if (last === 'u')              return base.slice(0,-1) + 'wa';    // usumu → usumwa
  }

  // parole in consonante: stessa progressione, ma raddoppia la consonante
  const prog = { a:'e', e:'i', i:'o', o:'u', u:'a' };
  if (a.isConsonantEnd && a.lastVowel && prog[a.lastVowel]) {
    const v2 = prog[a.lastVowel];
    // geminazione della consonante finale
    return base + cons + v2;
  }

  // fallback
  return base + 'e';
}

    // ===============================
    // Declinazioni PLURALE (wiki)
    // ===============================

   function buildPluralCases(lemma, singular) {
  const a = analyzeEnding(lemma);

  const plural = {};

  // 1. nominativo plurale (regola speciale)
  if (a.isConsonantEnd) {
    // raddoppia consonante finale e ripeti l’ultima vocale
    const m = a.clean.match(/([aeiouāēīōū])([^aeiouāēīōū]*)$/i);
    if (m) {
      const v = m[1];
      const c = a.finalConsonant;
      plural.nom = a.clean + c + v;        // tsaikis → tsaikisshi (poi normalizzabile come sshi)
    } else {
      plural.nom = a.clean;
    }
  } else if (a.isLongVowelEnd) {
    plural.nom = a.clean + 'hin';          // fupō → fupōhin
  } else {
    const lastV = a.clean.slice(-1);
    plural.nom = a.clean + lastV + 'n';    // miwa → miwaan
  }

  // 2. stem per gli altri casi: NOM singolare
  const stem = singular.nom;              // es. miwa, tsaikis

  const endsWithConsonant = a.isConsonantEnd;

  // GEN: +in / +en
  plural.gen = stem + (endsWithConsonant ? 'en' : 'in');

  // ACC: +ita / +ta
  plural.acc = stem + (endsWithConsonant ? 'ta' : 'ita');

  // DAT: +hi, con fenomeni fonetici
  if (endsWithConsonant && a.finalConsonant === 's') {
    // tsaikis + hi → tsaikisshi
    plural.dat = stem + 'shi';
  } else {
    plural.dat = stem + 'hi';
  }

  // ESS: +is / +es
  plural.ess = stem + (endsWithConsonant ? 'es' : 'is');

  // ALL: +ir / +er
  plural.all = stem + (endsWithConsonant ? 'er' : 'ir');

  // ABL: +il / +el
  plural.abl = stem + (endsWithConsonant ? 'el' : 'il');

  // INS: strumentale singolare + i
  plural.ins = singular.ins + 'i';   // es. miwae → miwaei; tsaikiso → tsaikisoi

  // correzione: lemmi con vocale lunga finale
  if (!endsWithConsonant && a.isLongVowelEnd) {
    // -hin → -hen nei casi forti
    plural.gen = plural.gen.replace(/hin$/, 'hen');
    plural.ess = plural.ess.replace(/hin$/, 'hen');
    plural.all = plural.all.replace(/hin$/, 'hen');
    plural.abl = plural.abl.replace(/hin$/, 'hen');
  }

  return plural;
}

    // ===============================
    // Funzione principale di declinazione
    // ===============================

    function declineNoun(lemma, dictInfo = null) {
        const sing = buildSingularCases(lemma);
        const plur = buildPluralCases(lemma, sing.forms);
        return {
            singular: sing.forms,
            plural:   plur,
            analysis: sing.analysis,
            dictInfo
        };
    }

    // ===============================
    // UI
    // ===============================

    function updateInterface(input, result) {
        // intestazione lemma
        if (result.dictInfo) {
            lemmaInfo.innerHTML = `
                <strong>${result.dictInfo.lemma}</strong>
                ${result.dictInfo.byakuzhi ? `<br><small>百字: ${result.dictInfo.byakuzhi}</small>` : ''}
                <br><em>${result.dictInfo.english}</em>
            `;
            lemmaInfo.className = 'notification is-primary';
        } else {
            lemmaInfo.innerHTML = `<em>${input}</em><br>(Not found; using general rules / 辞書に見つかりません。一般規則使用)`;
            lemmaInfo.className = 'notification is-warning';
        }

        const tbody = formsTable.querySelector('tbody');
        tbody.innerHTML = '';

        const rows = [
            { key: 'nom', name: 'Nominative / 主格',   note: '-' },
            { key: 'gen', name: 'Genitive / 属格',    note: 'sg: -n/-un, pl: -in/-en' },
            { key: 'acc', name: 'Accusative / 対格',  note: 'sg: V↑, pl: -ita/-ta' },
            { key: 'dat', name: 'Dative / 與格',      note: '+i / +hi' },
            { key: 'ess', name: 'Essive / 処格',      note: 'sg: -s/-us, pl: -is/-es' },
            { key: 'all', name: 'Allative / 向格',    note: 'sg: -r/-ur, pl: -ir/-er' },
            { key: 'abl', name: 'Ablative / 出格',    note: 'sg: -l/-ul, pl: -il/-el' },
            { key: 'ins', name: 'Instrumental / 具格',note: 'sg: vowel shift, pl: +i' }
        ];

        rows.forEach(c => {
            const row = tbody.insertRow();
            row.innerHTML = `
                <td>${c.name}</td>
                <td><strong>${result.singular[c.key]}</strong></td>
                <td><strong>${result.plural[c.key]}</strong></td>
                <td>${c.note}</td>
            `;
        });
    }

    // ===============================
    // Eventi
    // ===============================

    declineBtn.addEventListener('click', function() {
        const input = nounInput.value.trim();
        if (!input) return;

        const dictMatch = lookupLemma(input);
        const result    = declineNoun(dictMatch ? dictMatch.lemma : input, dictMatch);
        updateInterface(input, result);
    });

    nounInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') declineBtn.click();
    });

    loadDictionary();
});
</script>
</body>
</html>
