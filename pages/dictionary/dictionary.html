<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Izaki Dictionary 華邦語辞典</title>

<!-- Bulma CSS -->
<link rel="stylesheet" href="../../assets/bulma.min.css">

<style>
  body {
    background-color: #f7ecd8; /* pergamena */
    font-family: "Merriweather", Georgia, serif;
    margin: 0;
    padding: 0;
  }

  #container {
    width: 90%;
    max-width: 1000px;
    margin: 2rem auto;
    padding: 2rem 3rem;
    background-color: rgba(255, 250, 230, 0.95); /* leggermente più chiaro del body */
    border-radius: 10px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  }

  h1.title {
    color: #4b3b2a; /* marrone scuro */
    font-size: 2.2rem;
    margin-bottom: 2rem;
    text-align: center;
    text-shadow: 0 1px 0 #fff8e0;
  }

  label.label {
    color: #4b3b2a;
    font-weight: bold;
    font-size: 1rem;
  }

  .input, .select select {
    background-color: #fff8e0; /* chiaro pergamena */
    border: 1px solid #d4b87c;
    color: #4b3b2a;
    padding: 0.5rem 0.7rem;
    font-size: 1rem;
    border-radius: 5px;
    width: 100%;
    box-sizing: border-box;
  }

  .field {
    margin-bottom: 1.5rem;
  }

  #results div {
    margin-bottom: 0.7rem;
    padding: 0.7rem 1rem;
    border-left: 4px solid #d4b87c;
    background-color: rgba(255, 250, 230, 0.85);
    color: #3e2f1c;
    font-size: 1rem;
    border-radius: 5px;
  }

  .lemma {
    color: #4b2f1e; /* marrone scuro */
    font-weight: bold;
    font-size: 1.1rem;
  }

  .romaji {
    color: #a55d2d; /* arancione-marrone */
    margin-left: 0.5rem;
    font-style: italic;
  }

  .pos {
    font-style: italic;
    color: #7a5e3a;
    margin-left: 0.5rem;
  }

  .english {
    color: #1a3f6b; /* blu scuro */
    margin-left: 0.5rem;
  }

  .italian {
    color: #3e5a2a; /* verde caldo */
    margin-left: 0.5rem;
  }

  .example {
    display: block;
    color: #5e4732;
    margin-top: 0.3rem;
    font-style: italic;
  }
</style>
</head>
<body>

<!-- Navbar -->
<div id="navbar"></div>
<script src="/izaki-dictionary/scripts/script.js"></script>

  <div id="container">
  <h1 class="title">Izaki Dictionary 華邦語辞典</h1>

  <div class="field">
    <label class="label">Search 檢索</label>
    <div class="control">
      <input class="input" type="text" id="search" placeholder="Type to search...">
    </div>
  </div>

  <div class="field">
    <label class="label">Language 言語</label>
    <div class="control">
      <div class="select">
        <select id="lang">
          <option value="EN">English 印語</option>
          <option value="IT">Plevian 伏語</option>
          <option value="IZ">Izaki 華邦語</option>
        </select>
      </div>
    </div>
  </div>

  <div id="results"></div>
</div>

<h1 class="title">Izaki Dictionary 華邦語辞典</h1>

<div class="field">
  <label class="label">Search 檢索</label>
  <div class="control">
    <input class="input" type="text" id="search" placeholder="Type to search... 入力ઠૅડા 檢索">
  </div>
</div>

<div class="field">
  <label class="label">Language 言語</label>
  <div class="control">
    <div class="select">
      <select id="lang">
        <option value="EN">Ingerish 印語</option>
        <option value="IT">Plevian 伊語</option>
        <option value="IZ">Izaki 華邦語</option>
      </select>
    </div>
  </div>
</div>

<div id="results"></div>

<script>
// === IPA → ROMAJI function ===
function ipaToRomaji(ipa) {
  if (!ipa) return '';
  let romaji = ipa;

  const map = [
    [/aː/g, 'ā'], [/eː/g, 'ē'], [/iː/g, 'ī'], [/oː/g, 'ō'], [/uː/g, 'ū'],
    [/a/g, 'a'], [/e/g, 'e'], [/i/g, 'i'], [/o/g, 'o'], [/u/g, 'u'],
    [/y/g, 'y'], [/w/g, 'w'],
    [/dz/g, 'Ð'], [/ts/g, 'TS'], [/ʒ/g, 'ZH'], [/dʒ/g, 'J'], [/f/g, 'F'], [/v/g, 'V'],
    [/k/g, 'K'], [/ɡ/g, 'G'], [/h/g, 'H'], [/l/g, 'L'], [/m/g, 'M'], [/n/g, 'N'],
    [/p/g, 'P'], [/b/g, 'B'], [/s/g, 'S'], [/t/g, 'T'], [/z/g, 'Z'], [/tɕ/g, 'CH'],
    [/ʃ/g, 'SH'], [/ɾ/g, 'R'], [/r/g, 'R']
  ];

  map.forEach(([regex, rep]) => {
    romaji = romaji.replace(regex, rep);
  });

  return romaji;
}

// === Load JSON ===
fetch('../../data/dictionary.json')
  .then(response => response.json())
  .then(data => {

    // Add ROMAJI to each entry
    data.forEach(entry => {
      entry.ROMAJI = ipaToRomaji(entry.IZ);
    });

    const searchInput = document.getElementById('search');
    const langSelect = document.getElementById('lang');
    const resultsDiv = document.getElementById('results');

function renderResults() {
  const query = searchInput.value.toLowerCase();
  const lang = langSelect.value;

  const filtered = data.filter(e => {
    if (lang === "EN") return e.english?.some(w => w.toLowerCase().includes(query));
    if (lang === "IT") return e.italian?.some(w => w.toLowerCase().includes(query));
    if (lang === "IZ") {
      return (
        e.lemma?.toLowerCase().includes(query) ||
        e.ipa?.toLowerCase().includes(query) ||
        e.ROMAJI?.toLowerCase().includes(query)
      );
    }
  });

  resultsDiv.innerHTML = filtered.map(e => `
    <div class="entry">
      <div class="headword">
        <span class="lemma">${e.lemma}</span>
        <span class="ipa">【${e.ipa}】</span>
        <span class="pos">&lt;${e.pos || "—"}&gt;</span>
      </div>

      <div class="translations">
        ${e.english ? `<div class="english"><strong>EN:</strong> ${e.english.join(", ")}</div>` : ""}
        ${e.italian ? `<div class="italian"><strong>IT:</strong> ${e.italian.join(", ")}</div>` : ""}
      </div>

      ${e.example ? `<div class="example">EX: ${e.example}</div>` : ""}
    </div>
  `).join('');
}

    searchInput.addEventListener('input', renderResults);
    langSelect.addEventListener('change', renderResults);

    renderResults(); // inizializza con tutti i risultati
  })
  .catch(error => console.error("Error loading JSON / JSON 讀૮૾ટ્ટપ્ ૮ૅદ૾દ્발發生!:", error));
</script>

</body>
</html>
