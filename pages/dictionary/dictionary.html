<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Izaki Dictionary 華邦語辞典</title>

<!-- Bulma CSS -->
<link rel="stylesheet" href="../../assets/bulma.min.css">

<!-- Font gujarati per askaoza -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Gujarati:wght@400;600&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600&display=block">

<style>
  html[data-theme="light"] {
    --dict-bg: #f7ecd8;
    --dict-container: rgba(255, 250, 230, 0.95);
    --dict-input-bg: #fff8e0;
    --dict-input-border: #d4b87c;
    --dict-text: #4b3b2a;
    --dict-text-dark: #3e2f1c;
    --dict-lemma: #4b2f1e;
    --dict-byakuzhi: #c41e3a;
    --dict-askaoza: #8b6f47;
    --dict-ipa: #7a5e3a;
    --dict-pos: #5a4529;
    --dict-en: #1a3f6b;
    --dict-it: #3e5a2a;
    --dict-example: #5e4732;
    --dict-btn-bg: #d4b87c;
    --dict-btn-hover: #c4a86c;
    --dict-entry-bg: rgba(255, 250, 230, 0.85);
    --dict-entry-border: #d4b87c;
    --dict-table-header: #f0e8d0;
    --dict-table-border: #e0d4b8;
    --dict-table-bg: rgba(255, 255, 255, 0.5);
    --dict-shadow: rgba(0,0,0,0.1);
    --dict-counter-bg: rgba(212, 184, 124, 0.2);
    --dict-counter-border: #d4b87c;
  }

  html[data-theme="dark"] {
    --dict-bg: #1a1510;
    --dict-container: rgba(30, 25, 20, 0.95);
    --dict-input-bg: #2a2218;
    --dict-input-border: #5a4a32;
    --dict-text: #e5d5c0;
    --dict-text-dark: #d0c0a8;
    --dict-lemma: #f5e0c0;
    --dict-byakuzhi: #ff6b85;
    --dict-askaoza: #d4b87c;
    --dict-ipa: #c0a87a;
    --dict-pos: #b0a088;
    --dict-en: #93c5fd;
    --dict-it: #86efac;
    --dict-example: #d4b87c;
    --dict-btn-bg: #5a4a32;
    --dict-btn-hover: #6a5a42;
    --dict-entry-bg: rgba(40, 35, 28, 0.85);
    --dict-entry-border: #5a4a32;
    --dict-table-header: #3a302a;
    --dict-table-border: #4a3a2a;
    --dict-table-bg: rgba(35, 30, 25, 0.5);
    --dict-shadow: rgba(0,0,0,0.35);
    --dict-counter-bg: rgba(90, 74, 50, 0.3);
    --dict-counter-border: #5a4a32;
  }

  body {
    background-color: var(--dict-bg);
    font-family: "Merriweather", Georgia, serif;
    margin: 0;
    padding: 0;
    transition: background-color 0.2s ease;
  }

  #container {
    width: 90%;
    max-width: 1000px;
    margin: 2rem auto;
    padding: 2rem 3rem;
    background-color: var(--dict-container);
    border-radius: 10px;
    box-shadow: 0 5px 20px var(--dict-shadow);
    transition: background-color 0.2s ease, box-shadow 0.2s ease;
  }

  h1.title {
    color: var(--dict-text);
    font-size: 2.2rem;
    margin-bottom: 0.75rem;
    text-align: center;
  }

  #dict-stats {
    text-align: center;
    margin-bottom: 1.75rem;
    padding: 0.5rem 1rem;
    background: var(--dict-counter-bg);
    border: 1px solid var(--dict-counter-border);
    border-radius: 8px;
    font-size: 0.88rem;
    color: var(--dict-text);
    opacity: 0.85;
  }
  #dict-stats .count {
    font-weight: bold;
    font-size: 1rem;
  }
  #dict-stats .sep {
    margin: 0 0.6rem;
    opacity: 0.4;
  }

  label.label {
    color: var(--dict-text);
    font-weight: bold;
    font-size: 1rem;
  }

  .input, .select select {
    background-color: var(--dict-input-bg);
    border: 1px solid var(--dict-input-border);
    color: var(--dict-text);
    padding: 0.5rem 0.7rem;
    font-size: 1rem;
    border-radius: 5px;
    width: 100%;
    box-sizing: border-box;
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  .input:focus, .select select:focus {
    outline: none;
    border-color: var(--dict-btn-bg);
  }

  .field { margin-bottom: 1.5rem; }

  .entry {
    margin-bottom: 1.2rem;
    padding: 0.9rem 1rem;
    background-color: var(--dict-entry-bg);
    border-left: 4px solid var(--dict-entry-border);
    border-radius: 5px;
    font-size: 1rem;
    color: var(--dict-text-dark);
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  .headword { margin-bottom: 0.3rem; }

  .lemma { color: var(--dict-lemma); font-weight: bold; font-size: 1.2rem; }
  .byakuzhi { margin-left: 0.4rem; font-size: 1.4rem; color: var(--dict-byakuzhi); font-weight: 600; }
  .askaoza {
    margin-left: 0.6rem;
    font-family: "Anek Gujarati", "Noto Sans Gujarati", "Shruti", system-ui, sans-serif;
    font-size: 1.3rem;
    color: var(--dict-askaoza);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .ipa  { margin-left: 0.6rem; color: var(--dict-ipa); font-style: italic; }
  .pos  { margin-left: 0.6rem; color: var(--dict-pos); font-style: italic; }
  .translations div { margin-left: 1rem; }
  .english strong { color: var(--dict-en); }
  .italian strong { color: var(--dict-it); }
  .example { margin-left: 1rem; margin-top: 0.3rem; color: var(--dict-example); font-style: italic; }

  .info-message {
    padding: 1rem;
    background-color: var(--dict-entry-bg);
    border-radius: 5px;
    text-align: center;
    color: var(--dict-text);
    font-style: italic;
  }

  .decline-btn {
    margin-top: 0.5rem;
    padding: 0.4rem 0.8rem;
    background-color: var(--dict-btn-bg);
    color: var(--dict-text);
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: bold;
    transition: background-color 0.2s;
  }
  .decline-btn:hover { background-color: var(--dict-btn-hover); }

  .declension-table {
    margin-top: 1rem;
    display: none;
    background-color: var(--dict-table-bg);
    padding: 0.8rem;
    border-radius: 5px;
    font-size: 0.9rem;
    transition: background-color 0.2s ease;
  }
  .declension-table.show { display: block; }
  .declension-table table { width: 100%; border-collapse: collapse; }
  .declension-table th, .declension-table td {
    padding: 0.4rem 0.6rem;
    text-align: left;
    border-bottom: 1px solid var(--dict-table-border);
    color: var(--dict-text);
  }
  .declension-table th { background-color: var(--dict-table-header); font-weight: bold; }
  .declension-table .askaoza { font-size: 1.1rem; }
</style>
</head>
<body>

<div id="navbar"></div>

<div id="container">
  <h1 class="title">Izaki Dictionary 華邦語辞典</h1>

  <div id="dict-stats">
    <span>📖 <span class="count" id="stat-total">…</span> entries</span>
    <span class="sep">|</span>
    <span>🇯🇵 <span class="count" id="stat-native">…</span> native words</span>
    <span class="sep">|</span>
    <span>字 <span class="count" id="stat-compound">…</span> byakuzhi compounds</span>
    <span class="sep">|</span>
    <span>🔄 last sync: <span id="stat-date">…</span></span>
  </div>

  <div class="field">
    <label class="label">Search 檢索</label>
    <div class="control">
      <input class="input" type="text" id="search" placeholder="🔎 Type to search... (Latin, Byakuzhi, Askaoza, English, Italian)">
    </div>
  </div>

  <div class="field">
    <label class="label">Language 言語</label>
    <div class="control">
      <div class="select">
        <select id="lang">
          <option value="EN">English 印語</option>
          <option value="IT">Plevian 伏語</option>
          <option value="IZ">Izaki 華邦語</option>
        </select>
      </div>
    </div>
  </div>

  <div id="results">
    <div class="info-message">
      👆 Start typing to search the dictionary / 辞書を検索するには入力してください
    </div>
  </div>
</div>

<script src="../../scripts/script.js"></script>
<script src="../../scripts/askaoza-engine.js"></script>
<script src="../tools/declensor-logic.js"></script>

<script>
function startsWithQuery(text, query) {
  if (!text || !query) return false;
  const textLower = text.toLowerCase();
  const queryLower = query.toLowerCase();
  if (textLower.startsWith(queryLower)) return true;
  return textLower.split(/\s+/).some(w => w.startsWith(queryLower));
}

function ipaToRomaji(ipa) {
  if (!ipa) return '';
  let r = ipa;
  const map = [
    [/aː/g,'ā'],[/eː/g,'ē'],[/iː/g,'ī'],[/oː/g,'ō'],[/uː/g,'ū'],
    [/a/g,'a'],[/e/g,'e'],[/i/g,'i'],[/o/g,'o'],[/u/g,'u'],
    [/y/g,'y'],[/w/g,'w'],[/dz/g,'Ð'],[/ts/g,'TS'],[/ʒ/g,'ZH'],
    [/dʒ/g,'J'],[/f/g,'F'],[/v/g,'V'],[/k/g,'K'],[/ɡ/g,'G'],
    [/h/g,'H'],[/l/g,'L'],[/m/g,'M'],[/n/g,'N'],[/p/g,'P'],
    [/b/g,'B'],[/s/g,'S'],[/t/g,'T'],[/z/g,'Z'],[/tɕ/g,'CH'],
    [/ʃ/g,'SH'],[/ɾ/g,'R'],[/r/g,'R']
  ];
  map.forEach(([re, rep]) => { r = r.replace(re, rep); });
  return r;
}

function isNoun(pos) {
  if (!pos) return false;
  const p = pos.toLowerCase().trim();
  return p.includes('n=') || p.includes('noun');
}

// Compound = ha notes==='compound' OPPURE ha byakuzhi non vuoto ma nessun lemma latino
// La strategia più robusta: usa notes==='compound' come build_dictionary.py
function isCompound(e) {
  return e.notes === 'compound';
}

if (typeof toAskaozaText !== 'function') {
  window.toAskaozaText = function(t) { return t; };
}

if (typeof declineNounSimple !== 'function') {
  window.declineNounSimple = function(lemma) {
    const sfx = (s) => lemma + s;
    return {
      singular: { nom: lemma, gen: sfx('-gen'), acc: sfx('-acc'), dat: sfx('-dat'), ess: sfx('-ess'), all: sfx('-all'), abl: sfx('-abl'), ins: sfx('-ins') },
      plural:   { nom: sfx('-pl'), gen: sfx('-pl-gen'), acc: sfx('-pl-acc'), dat: sfx('-pl-dat'), ess: sfx('-pl-ess'), all: sfx('-pl-all'), abl: sfx('-pl-abl'), ins: sfx('-pl-ins') }
    };
  };
}

function toggleDeclension(id) {
  const t = document.getElementById('decl-' + id);
  if (t) t.classList.toggle('show');
}

function loadLastSyncDate() {
  fetch('https://api.github.com/repos/izaland/izaki-dictionary/commits?path=data/dictionary.json&per_page=1')
    .then(r => r.json())
    .then(commits => {
      if (commits && commits[0]) {
        const d = new Date(commits[0].commit.committer.date);
        document.getElementById('stat-date').textContent = d.toLocaleDateString('en-GB', {
          day: '2-digit', month: 'long', year: 'numeric', timeZone: 'Asia/Tokyo'
        });
      }
    })
    .catch(() => { document.getElementById('stat-date').textContent = 'n/a'; });
}

loadLastSyncDate();

fetch('../../data/dictionary.json')
  .then(r => r.json())
  .then(data => {

    const compound = data.filter(isCompound).length;
    const native   = data.length - compound;
    document.getElementById('stat-total').textContent    = data.length.toLocaleString('en');
    document.getElementById('stat-native').textContent   = native.toLocaleString('en');
    document.getElementById('stat-compound').textContent = compound.toLocaleString('en');

    data.forEach((e, i) => {
      e.ROMAJI  = ipaToRomaji(e.ipa || '');
      e.ASKAOZA = toAskaozaText(e.lemma || e.reading || '');
      e.INDEX   = i;
    });

    const searchInput = document.getElementById('search');
    const langSelect  = document.getElementById('lang');
    const resultsDiv  = document.getElementById('results');

    function renderResults() {
      const query = searchInput.value.toLowerCase().trim();
      const lang  = langSelect.value;

      if (!query) {
        resultsDiv.innerHTML = '<div class="info-message">👆 Start typing to search the dictionary / 辞書を検索するには入力してください</div>';
        return;
      }

      const filtered = data.filter(e => {
        if (lang === 'EN') return (e.english && e.english.some(w => startsWithQuery(w, query))) || (e.word && startsWithQuery(e.word, query));
        if (lang === 'IT') return e.italian && e.italian.some(w => startsWithQuery(w, query));
        if (lang === 'IZ') return (
          (e.lemma    && e.lemma.toLowerCase().includes(query)) ||
          (e.reading  && e.reading.toLowerCase().includes(query)) ||
          (e.byakuzhi && e.byakuzhi.includes(query)) ||
          (e.ipa      && e.ipa.toLowerCase().includes(query)) ||
          (e.ROMAJI   && e.ROMAJI.toLowerCase().includes(query)) ||
          (e.ASKAOZA  && e.ASKAOZA.includes(query))
        );
        return false;
      });

      const shown = filtered.slice(0, 100);

      if (shown.length === 0) {
        resultsDiv.innerHTML = '<div class="info-message">❌ No results found / 検索結果無</div>';
        return;
      }

      let warn = '';
      if (filtered.length > 100) {
        warn = `<div class="info-message">⚠️ Showing first 100 of ${filtered.length} results. Refine your search.</div>`;
      }

      resultsDiv.innerHTML = warn + shown.map(e => {
        let declHTML = '';
        if (isNoun(e.pos)) {
          const d = declineNounSimple(e.lemma || e.reading);
          const cases = ['nom','gen','acc','dat','ess','all','abl','ins'];
          declHTML = `
            <button class="decline-btn" onclick="toggleDeclension(${e.INDEX})">📖 Show declensions / 曲用表示</button>
            <div id="decl-${e.INDEX}" class="declension-table">
              <table>
                <thead><tr><th>Case</th><th>Singular</th><th>Askaoza</th><th>Plural</th><th>Askaoza</th></tr></thead>
                <tbody>${cases.map(c => `
                  <tr>
                    <td>${c[0].toUpperCase()+c.slice(1)}</td>
                    <td>${d.singular[c]}</td><td class="askaoza">${toAskaozaText(d.singular[c])}</td>
                    <td>${d.plural[c]}</td><td class="askaoza">${toAskaozaText(d.plural[c])}</td>
                  </tr>`).join('')}
                </tbody>
              </table>
            </div>`;
        }

        const bHTML = e.byakuzhi ? `<span class="byakuzhi">${e.byakuzhi}</span>` : '';

        return `
          <div class="entry">
            <div class="headword">
              <span class="lemma">${e.lemma || e.reading || e.word || '—'}</span>
              ${bHTML}
              <span class="askaoza">${e.ASKAOZA}</span>
              <span class="ipa">【${e.ipa || '—'}】</span>
              <span class="pos">&lt;${e.pos || e.type || '—'}&gt;</span>
            </div>
            <div class="translations">
              ${e.english && e.english.length ? `<div class="english"><strong>EN:</strong> ${e.english.join(', ')}</div>` : ''}
              ${e.word ? `<div class="english"><strong>EN:</strong> ${e.word}</div>` : ''}
              ${e.italian && e.italian.length ? `<div class="italian"><strong>IT:</strong> ${e.italian.join(', ')}</div>` : ''}
            </div>
            ${e.example ? `<div class="example">EX: ${e.example}</div>` : ''}
            ${declHTML}
          </div>`;
      }).join('');
    }

    searchInput.addEventListener('input', renderResults);
    langSelect.addEventListener('change', renderResults);
    renderResults();
  })
  .catch(err => {
    console.error('Error loading JSON:', err);
    document.getElementById('results').innerHTML = '<div class="info-message">❌ Error loading dictionary data.</div>';
  });
</script>

</body>
</html>
